services:
  - type: web
    name: summer-vibes-site
    runtime: static
    buildCommand: echo "Static Summer Vibes site ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin

  - type: web
    name: summer-vibes-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: DATABASE_SSL
        value: true
      - key: RUN_MIGRATIONS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: summer-vibes-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ORG_NOTIFICATION_EMAIL
        sync: false

databases:
  - name: summer-vibes-db
